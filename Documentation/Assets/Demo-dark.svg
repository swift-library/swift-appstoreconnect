<svg xmlns="http://www.w3.org/2000/svg" width="605" height="263" viewBox="0 0 605 263" role="img" aria-labelledby="title desc">
  <title id="title">App Store Connect · preview a write</title>
  <desc id="desc">Recorded commands and standard output. Build diagnostics are written to standard error.</desc>
  <rect x="0.5" y="0.5" width="604" height="262" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M 10 0.5 H 595 Q 604.5 0.5 604.5 10 V 34 H 0.5 V 10 Q 0.5 0.5 10 0.5 Z" fill="#161b22"/>
  <path d="M 0.5 34 H 604.5" stroke="#30363d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="38" cy="17" r="5" fill="#febc2e"/><circle cx="56" cy="17" r="5" fill="#28c840"/>
  <g font-family="ui-monospace, monospace" font-size="14">
    <text x="302.5" y="22" text-anchor="middle" fill="#8b949e">App Store Connect · preview a write</text>
    <text x="20" y="68" fill="#c9d1d9" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">appstoreconnect --version</tspan></text>
    <text x="20" y="89" fill="#c9d1d9" xml:space="preserve">0.2.0</text>
    <text x="20" y="110" fill="#c9d1d9" xml:space="preserve"></text>
    <text x="20" y="131" fill="#c9d1d9" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">appstoreconnect testflight invitations create --app example-app</tspan></text>
    <text x="20" y="152" fill="#c9d1d9" xml:space="preserve">Dry run betaTesterInvitations_createInstance</text>
    <text x="20" y="173" fill="#c9d1d9" xml:space="preserve">Source: publicAPIBacked</text>
    <text x="20" y="194" fill="#c9d1d9" xml:space="preserve">Mutates: true</text>
    <text x="20" y="215" fill="#c9d1d9" xml:space="preserve">Create a TestFlight beta tester invitation for app example-app.</text>
    <text x="20" y="236" fill="#c9d1d9" xml:space="preserve">- appID: example-app</text>
  </g>
</svg>
