name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: swift-library/.github/.github/workflows/policy.yml@0916cfeef68d8fcc70107fc72d31474bd3450af4
    with:
      allow-terms: Cursor
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@0916cfeef68d8fcc70107fc72d31474bd3450af4
