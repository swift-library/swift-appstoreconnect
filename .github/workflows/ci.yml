name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: swift-library/.github/.github/workflows/policy.yml@17dfed8fc1f3a1e98f15fa28077991b2ca0d551d
    with:
      allow-terms: Cursor
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@17dfed8fc1f3a1e98f15fa28077991b2ca0d551d
