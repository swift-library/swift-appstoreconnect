name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing accepted version tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@0916cfeef68d8fcc70107fc72d31474bd3450af4
    with:
      ref: ${{ inputs.tag }}
  publish:
    needs: validate
    permissions:
      contents: write
      actions: read
    uses: swift-library/.github/.github/workflows/swift-package-release.yml@0916cfeef68d8fcc70107fc72d31474bd3450af4
    with:
      tag: ${{ inputs.tag }}
      accepted_commit: ${{ needs.validate.outputs.commit }}
